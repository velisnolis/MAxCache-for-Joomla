PLG_SYSTEM_MAXCACHE_XML_DESCRIPTION="Desa les pàgines de Joomla com a fitxers HTML estàtics en rutes deterministes perquè Apache o MAx Cache de CloudLinux les serveixin directament."
PLG_SYSTEM_MAXCACHE_FIELD_BROWSERCACHE_LABEL="Utilitza la memòria cau del navegador"
PLG_SYSTEM_MAXCACHE_FIELD_EXCLUDE_MENU_ITEMS_LABEL="Exclou elements de menú"
PLG_SYSTEM_MAXCACHE_FIELD_CACHE_ROOT_LABEL="Carpeta arrel de la memòria cau estàtica"
PLG_SYSTEM_MAXCACHE_FIELD_PATH_MODE_LABEL="Estructura de les rutes"
PLG_SYSTEM_MAXCACHE_FIELD_VARY_LANGUAGE_LABEL="Varia segons l'idioma"
PLG_SYSTEM_MAXCACHE_FIELD_VARY_MOBILE_LABEL="Varia segons si és mòbil"
PLG_SYSTEM_MAXCACHE_FIELD_LANGUAGE_ROUTING_STATUS_LABEL="Idioma a les URL"
PLG_SYSTEM_MAXCACHE_FIELD_PLUGIN_ORDER_STATUS_LABEL="Ordre del connector"
PLG_SYSTEM_MAXCACHE_FIELD_BUILT_IN_EXCLUSIONS_LABEL="Exclusions integrades"
PLG_SYSTEM_MAXCACHE_FIELD_EXCLUDE_LABEL="Exclou URL"
PLG_SYSTEM_MAXCACHE_FIELD_EXCLUDE_DESC="Un patró per línia. Els patrons es comparen amb la URL externa actual i amb la URL interna de Joomla. Les exclusions habituals de Joomla ja hi són per defecte; afegiu aquí les pròpies del lloc."
PLG_SYSTEM_MAXCACHE_FIELD_SITE_HOSTS_LABEL="Dominis coneguts del lloc"
PLG_SYSTEM_MAXCACHE_FIELD_SITE_HOSTS_DESC="Un nom de host per línia. Es fan servir per a la purga dirigida i per generar el bloc del servidor quan les peticions de l'administració no tenen prou context del lloc. En una instal·lació nova i desactivada, MAx Cache hi pot posar els dominis que detecta."
PLG_SYSTEM_MAXCACHE_FIELD_BYPASS_COOKIES_LABEL="Galetes que eviten la memòria cau"
PLG_SYSTEM_MAXCACHE_FIELD_BYPASS_COOKIES_DESC="Un nom de galeta per línia. Si la petició porta alguna d'aquestes galetes, no es desa a la memòria cau estàtica. Incloeu-hi només galetes que canvien l'HTML generat al servidor, com les d'inici de sessió. No hi poseu galetes de consentiment que només actuen al navegador, com yootheme_consent."
PLG_SYSTEM_MAXCACHE_FIELD_ALLOWED_QUERY_PARAMS_LABEL="Paràmetres de consulta permesos"
PLG_SYSTEM_MAXCACHE_FIELD_ALLOWED_QUERY_PARAMS_DESC="Reservat per a un ús futur. Ara mateix no es desa cap petició amb paràmetres de consulta, tampoc les que portin els noms desats aquí. Els blocs de servidor generats no activen variants per consulta."
PLG_SYSTEM_MAXCACHE_FIELD_TRACKING_QUERY_PARAMS_LABEL="Paràmetres de seguiment"
PLG_SYSTEM_MAXCACHE_FIELD_TRACKING_QUERY_PARAMS_DESC="Opcional. Un nom de paràmetre per línia, per exemple utm_source, utm_medium, utm_campaign, gclid, fbclid o msclkid. Quan la consulta d'una URL només conté aquests paràmetres, les regles del servidor serveixen la pàgina canònica desada; MAx Cache no desa mai res a partir d'aquestes peticions. Deixeu-ho buit si alguna pàgina llegeix aquests paràmetres en PHP, per exemple un camp de formulari que s'omple amb utm_source. Després de canviar la llista, torneu a aplicar les regles del servidor i, en mode mod_maxcache, valideu-ho abans en un entorn de proves."
PLG_SYSTEM_MAXCACHE_FIELD_CACHE_FORM_PAGES_LABEL="Desa a la memòria cau les pàgines amb formularis"
PLG_SYSTEM_MAXCACHE_FIELD_CACHE_FORM_PAGES_DESC="Desactivat per defecte: una pàgina que conté un testimoni de formulari de Joomla no es desa mai. Si l'activeu, la pàgina es desa sense el testimoni i el navegador demana el del visitant quan aquest comença a fer servir el formulari. Cal JavaScript i el connector Ajax - Fragment de MAxCache. La resta del formulari queda tal com era quan es va desar la pàgina; no l'activeu per a formularis amb valors calculats al servidor a cada visita (controls antispam basats en el temps, camps ocults amb la data, la IP o un codi d'un sol ús, dades del visitant ja omplertes). Una extensió de formularis amb exclusió pròpia de la memòria cau de pàgina, com Page Cache - RSForm! Pro, continua excloent les seves pàgines fins que es desactiva aquell connector. Purgueu la memòria cau després de canviar aquesta opció i proveu cada formulari."
PLG_SYSTEM_MAXCACHE_FIELD_WRITE_GZIP_LABEL="Desa també la versió gzip"
PLG_SYSTEM_MAXCACHE_FIELD_PURGE_STRATEGY_LABEL="Estratègia de purga"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_SAVE_LABEL="Regenera en desar a Joomla"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_SAVE_DESC="Amb la purga completa activada, buida tota la memòria cau estàtica després de les accions de desar de Joomla que s'hi integren, i les visites següents la tornen a generar."
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_INTERVAL_LABEL="Regenera a intervals"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_INTERVAL_DESC="Buida tota la memòria cau estàtica a intervals fixos. Les visites següents tornen a generar les pàgines."
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_INTERVAL_SECONDS_LABEL="Interval de regeneració (segons)"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_INTERVAL_SECONDS_DESC="Segons mínims entre dues purgues completes automàtiques fetes per interval."
PLG_SYSTEM_MAXCACHE_FIELD_PURGE_INTEGRATION_STATUS_LABEL="Integració amb Cache Cleaner"
PLG_SYSTEM_MAXCACHE_FIELD_DEBUG_HEADERS_LABEL="Capçaleres de depuració"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_MODE_LABEL="Tipus de bloc del servidor"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_HELP_LABEL="Integració amb el servidor"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_HELP_DESC="El connector genera el bloc del servidor i el pot aplicar, però l'escriptura al .htaccess sempre és una acció explícita, perquè depèn dels permisos, de la configuració del vhost i de l'ordre de les regles de reescriptura."
PLG_SYSTEM_MAXCACHE_FIELD_HTACCESS_STATUS_LABEL="Estat del .htaccess"
PLG_SYSTEM_MAXCACHE_FIELD_HTACCESS_ACTIONS_LABEL="Accions sobre el .htaccess"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_PREVIEW_LABEL="Previsualització del bloc del servidor"
PLG_SYSTEM_MAXCACHE_OPTION_HOST_SEF="Host + ruta SEF"
PLG_SYSTEM_MAXCACHE_OPTION_HOST_LANGUAGE_SEF="Host + idioma + ruta SEF"
PLG_SYSTEM_MAXCACHE_OPTION_PURGE_TARGETED="Dirigida"
PLG_SYSTEM_MAXCACHE_OPTION_PURGE_FULL="Completa"
