PLG_SYSTEM_MAXCACHE_XML_DESCRIPTION="Guarda las páginas de Joomla como archivos HTML estáticos en rutas deterministas para que Apache o MAx Cache de CloudLinux las sirvan directamente."
PLG_SYSTEM_MAXCACHE_FIELD_BROWSERCACHE_LABEL="Usar la caché del navegador"
PLG_SYSTEM_MAXCACHE_FIELD_EXCLUDE_MENU_ITEMS_LABEL="Excluir elementos de menú"
PLG_SYSTEM_MAXCACHE_FIELD_CACHE_ROOT_LABEL="Carpeta raíz de la caché estática"
PLG_SYSTEM_MAXCACHE_FIELD_PATH_MODE_LABEL="Estructura de las rutas"
PLG_SYSTEM_MAXCACHE_FIELD_VARY_LANGUAGE_LABEL="Variar según el idioma"
PLG_SYSTEM_MAXCACHE_FIELD_VARY_MOBILE_LABEL="Variar según si es móvil"
PLG_SYSTEM_MAXCACHE_FIELD_LANGUAGE_ROUTING_STATUS_LABEL="Idioma en las URL"
PLG_SYSTEM_MAXCACHE_FIELD_PLUGIN_ORDER_STATUS_LABEL="Orden del plugin"
PLG_SYSTEM_MAXCACHE_FIELD_BUILT_IN_EXCLUSIONS_LABEL="Exclusiones integradas"
PLG_SYSTEM_MAXCACHE_FIELD_EXCLUDE_LABEL="Excluir URL"
PLG_SYSTEM_MAXCACHE_FIELD_EXCLUDE_DESC="Un patrón por línea. Los patrones se comparan con la URL externa actual y con la URL interna de Joomla. Las exclusiones habituales de Joomla ya vienen por defecto; añada aquí las propias del sitio."
PLG_SYSTEM_MAXCACHE_FIELD_SITE_HOSTS_LABEL="Dominios conocidos del sitio"
PLG_SYSTEM_MAXCACHE_FIELD_SITE_HOSTS_DESC="Un nombre de host por línea. Se usan para la purga dirigida y para generar el bloque del servidor cuando las peticiones de la administración no tienen suficiente contexto del sitio. En una instalación nueva y desactivada, MAx Cache puede rellenar los dominios que detecta."
PLG_SYSTEM_MAXCACHE_FIELD_BYPASS_COOKIES_LABEL="Cookies que evitan la caché"
PLG_SYSTEM_MAXCACHE_FIELD_BYPASS_COOKIES_DESC="Un nombre de cookie por línea. Si la petición lleva alguna de estas cookies, no se guarda en la caché estática. Incluya solo cookies que cambian el HTML generado en el servidor, como las de inicio de sesión. No incluya cookies de consentimiento que solo actúan en el navegador, como yootheme_consent."
PLG_SYSTEM_MAXCACHE_FIELD_ALLOWED_QUERY_PARAMS_LABEL="Parámetros de consulta permitidos"
PLG_SYSTEM_MAXCACHE_FIELD_ALLOWED_QUERY_PARAMS_DESC="Reservado para un uso futuro. Ahora mismo no se guarda ninguna petición con parámetros de consulta, tampoco las que lleven los nombres guardados aquí. Los bloques de servidor generados no activan variantes por consulta."
PLG_SYSTEM_MAXCACHE_FIELD_TRACKING_QUERY_PARAMS_LABEL="Parámetros de seguimiento"
PLG_SYSTEM_MAXCACHE_FIELD_TRACKING_QUERY_PARAMS_DESC="Opcional. Un nombre de parámetro por línea, por ejemplo utm_source, utm_medium, utm_campaign, gclid, fbclid o msclkid. Cuando la consulta de una URL solo contiene estos parámetros, las reglas del servidor sirven la página canónica guardada; MAx Cache nunca guarda nada a partir de estas peticiones. Déjelo vacío si alguna página lee estos parámetros en PHP, por ejemplo un campo de formulario que se rellena con utm_source. Tras cambiar la lista, vuelva a aplicar las reglas del servidor y, en modo mod_maxcache, valídelo antes en un entorno de pruebas."
PLG_SYSTEM_MAXCACHE_FIELD_CACHE_FORM_PAGES_LABEL="Guardar en caché las páginas con formularios"
PLG_SYSTEM_MAXCACHE_FIELD_CACHE_FORM_PAGES_DESC="Desactivado por defecto: una página que contiene un token de formulario de Joomla no se guarda nunca. Si lo activa, la página se guarda sin el token y el navegador pide el del visitante cuando este empieza a usar el formulario. Requiere JavaScript y el plugin Ajax - Fragmento de MAxCache. El resto del formulario queda tal como era cuando se guardó la página; no lo active para formularios con valores calculados en el servidor en cada visita (controles antispam basados en el tiempo, campos ocultos con la fecha, la IP o un código de un solo uso, datos del visitante ya rellenados). Una extensión de formularios con exclusión propia de la caché de página, como Page Cache - RSForm! Pro, sigue excluyendo sus páginas hasta que se desactiva ese plugin. Purgue la caché después de cambiar esta opción y pruebe cada formulario."
PLG_SYSTEM_MAXCACHE_FIELD_WRITE_GZIP_LABEL="Guardar también la versión gzip"
PLG_SYSTEM_MAXCACHE_FIELD_PURGE_STRATEGY_LABEL="Estrategia de purga"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_SAVE_LABEL="Regenerar al guardar en Joomla"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_SAVE_DESC="Con la purga completa activada, vacía toda la caché estática después de las acciones de guardar de Joomla que se integran, y las visitas siguientes la vuelven a generar."
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_INTERVAL_LABEL="Regenerar a intervalos"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_ON_INTERVAL_DESC="Vacía toda la caché estática a intervalos fijos. Las visitas siguientes vuelven a generar las páginas."
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_INTERVAL_SECONDS_LABEL="Intervalo de regeneración (segundos)"
PLG_SYSTEM_MAXCACHE_FIELD_FULL_REGENERATE_INTERVAL_SECONDS_DESC="Segundos mínimos entre dos purgas completas automáticas hechas por intervalo."
PLG_SYSTEM_MAXCACHE_FIELD_PURGE_INTEGRATION_STATUS_LABEL="Integración con Cache Cleaner"
PLG_SYSTEM_MAXCACHE_FIELD_DEBUG_HEADERS_LABEL="Cabeceras de depuración"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_MODE_LABEL="Tipo de bloque del servidor"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_HELP_LABEL="Integración con el servidor"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_HELP_DESC="El plugin genera el bloque del servidor y puede aplicarlo, pero la escritura en el .htaccess siempre es una acción explícita, porque depende de los permisos, de la configuración del vhost y del orden de las reglas de reescritura."
PLG_SYSTEM_MAXCACHE_FIELD_HTACCESS_STATUS_LABEL="Estado del .htaccess"
PLG_SYSTEM_MAXCACHE_FIELD_HTACCESS_ACTIONS_LABEL="Acciones sobre el .htaccess"
PLG_SYSTEM_MAXCACHE_FIELD_SERVER_SNIPPET_PREVIEW_LABEL="Vista previa del bloque del servidor"
PLG_SYSTEM_MAXCACHE_OPTION_HOST_SEF="Host + ruta SEF"
PLG_SYSTEM_MAXCACHE_OPTION_HOST_LANGUAGE_SEF="Host + idioma + ruta SEF"
PLG_SYSTEM_MAXCACHE_OPTION_PURGE_TARGETED="Dirigida"
PLG_SYSTEM_MAXCACHE_OPTION_PURGE_FULL="Completa"
PLG_SYSTEM_MAXCACHE_OPTION_SERVER_SNIPPET_APACHE="Reescritura de Apache"
PLG_SYSTEM_MAXCACHE_OPTION_SERVER_SNIPPET_MOD_MAXCACHE="mod_maxcache de CloudLinux"
