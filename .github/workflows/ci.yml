name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find pkg_maxcache tests -name '*.php' -print0)
          exit "$status"

      - name: Unit and runtime tests
        run: php tests/run.php

      - name: Route report tests
        run: tests/route-report.sh

  package:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build without touching the update feed
        run: |
          zip_path="$(./docker/build-package.sh --no-feed)"
          unzip -l "$zip_path"
          git diff --exit-code -- updates/

      - name: Manifests share one version
        run: |
          versions="$(grep -ho '<version>[^<]*' pkg_maxcache/pkg_maxcache.xml pkg_maxcache/packages/*/*.xml | sort -u)"
          echo "$versions"
          [ "$(echo "$versions" | wc -l)" -eq 1 ]
